[workspace]
resolver = "2"
members = [".", "crates/protocol"]

[package]
name = "jet-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/faberline/jet-bridge"
description = "Browser and application automation through CLI and MCP"

[dependencies]
jet-bridge-protocol = { path = "crates/protocol" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "string"] }
dirs = "5"
futures-util = "0.3"
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "rustls-tls-native-roots", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3.15"
thiserror = "2"
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "2"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
